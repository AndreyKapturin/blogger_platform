components: 
  schemas: 
    ViewCommentSchema:
      type: object
      required: 
        - id
        - content
        - commentatorInfo
        - createdAt
      properties: 
        id:
          type: string
        content:
          type: string
        commentatorInfo:
          type: object
          properties:
            userId:
              type: string
            userLogin:
              type: string
        createdAt:
          type: string
          format: date-time

    ViewCommentsPaginationSchema:
      allOf:
        - $ref: '#/components/schemas/BasePaginatorSchema'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ViewCommentSchema'
    
    InputCommentSchema:
      type: object
      required: 
        - content
      properties: 
        content:
          type: string
          minLength: 30
          maxLength: 300

    CommentsSortFieldSchema:
      type: string
      description: available fields for comments sorting
      enum: 
        - createdAt
      default: createdAt

  parameters:
    CommentsSortByQueryParam:
      in: query
      name: sortBy
      description: sorting comments field name
      schema: 
        $ref: '#/components/schemas/CommentsSortFieldSchema'
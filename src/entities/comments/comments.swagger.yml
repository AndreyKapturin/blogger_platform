paths:
  /comments:
    put:
      tags: [Comments]
      summary: Update comment by id
      security: 
        - BearerAuth: []
      parameters: 
        - $ref: '#/components/parameters/CommentIdPathParam'
      requestBody: 
        description: Data for create comment
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/InputCommentSchema'
      responses: 
        '204':
          description: Successfully udpate comment
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: If try update comment of another user
        '404':
          description: Comment not found

components: 
  schemas: 
    ViewCommentSchema:
      type: object
      required: 
        - id
        - content
        - commentatorInfo
        - createdAt
      properties: 
        id:
          type: string
        content:
          type: string
        commentatorInfo:
          type: object
          properties:
            userId:
              type: string
            userLogin:
              type: string
        createdAt:
          type: string
          format: date-time

    ViewCommentsPaginationSchema:
      allOf:
        - $ref: '#/components/schemas/BasePaginatorSchema'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ViewCommentSchema'
    
    InputCommentSchema:
      type: object
      required: 
        - content
      properties: 
        content:
          type: string
          minLength: 30
          maxLength: 300

    CommentsSortFieldSchema:
      type: string
      description: available fields for comments sorting
      enum: 
        - createdAt
      default: createdAt

  parameters:
    CommentsSortByQueryParam:
      in: query
      name: sortBy
      description: sorting comments field name
      schema: 
        $ref: '#/components/schemas/CommentsSortFieldSchema'

    CommentIdPathParam:
      in: path
      name: id
      required: true
      description: Mongo ObjectId format unique identifier of the comment
      schema:
        type: string
        example: '696c891bdfcde0419df1674d'
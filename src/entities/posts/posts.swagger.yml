paths:
  /posts:
    get:
      tags: [Posts]
      summary: Get list a posts
      responses: 
        '200':
          description: Successful get post list
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/ViewPostSchema'

    post:
      tags: [Posts]
      summary: Create a new post
      security: 
        - BasicAuth: []
      requestBody: 
        description: Data for create post
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/InputPostSchema'
      responses: 
        '201':
          description: Successfully create post
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/ViewPostSchema'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          description: Unauthorized
  /posts/{id}:
    get:
      tags: [Posts]
      summary: Get post by id
      parameters: 
        - $ref: '#/components/parameters/PostIdPathParam'
      responses: 
        '200':
          description: Successful
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/ViewPostSchema'
        '404':
          description: Post not found
    put:
      tags: [Posts]
      summary: Update post by id
      security:
        - BasicAuth: []
      parameters: 
        - $ref: '#/components/parameters/PostIdPathParam'
      requestBody: 
        description: Data for update post
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/InputPostSchema'
      responses: 
        '204':
          description: Successfully update post
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '404':
          description: Post not found
    delete:
      tags: [Posts]
      summary: Delete post by id
      security:
        - BasicAuth: []
      parameters: 
        - $ref: '#/components/parameters/PostIdPathParam'
      responses: 
        '204':
          description: Successfully delete post
        '404':
          description: Post not found
      
components: 
  schemas: 
    ViewPostSchema:
      type: object
      required: 
        - id
        - title
        - shortDescription
        - content
        - blogId
        - blogName
        - createdAt
      properties: 
        id:
          type: string
        title:
          type: string
        shortDescription:
          type: string
        content:
          type: string
        blogId:
          type: string
        blogName:
          type: string
        createdAt:
          type: string
          format: date-time

    ViewPostsPaginationSchema:
      allOf:
        - $ref: '#/components/schemas/BasePaginatorSchema'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ViewPostSchema'

    InputPostSchema:
      type: object
      required: 
        - title
        - shortDescription
        - content
        - blogId
      properties: 
        title:
          type: string
        shortDescription:
          type: string
        content:
          type: string
        blogId:
          type: string
  
    PostsSortFieldSchema:
      type: string
      description: available fields for posts sorting
      enum: 
        - title
        - blogName
        - createdAt
      default: createdAt

  parameters:
    PostIdPathParam:
      in: path
      name: id
      required: true
      description: Mongo ObjectId format unique identifier of the post
      schema:
        type: string
        example: '696c891bdfcde0419df1674d'
    
    PostsSortByQueryParam:
      in: query
      name: sortBy
      description: sorting post field name
      schema: 
        allOf: 
          - $ref: '#/components/schemas/PostsSortFieldSchema'
        type: string
        default: createdAt

  responses: 
    PaginatedPostsResponse:
      description: Paginated posts
      content: 
        application/json: 
          schema: 
            $ref: '#/components/schemas/ViewPostsPaginationSchema'

    SuccessfullyCreatePost:
      description: Successfully create post
      content: 
        application/json: 
          schema: 
            $ref: '#/components/schemas/ViewPostSchema'
